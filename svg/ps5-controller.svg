<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d">
  <title id="t">PS5-style wireless controller</title>
  <desc id="d">A white two-tone gamepad with a touchpad, two analog sticks, a d-pad and four face buttons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2140"/>
      <stop offset="1" stop-color="#0a0d1c"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#eef0f4"/>
      <stop offset="1" stop-color="#c9ced8"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d36"/>
      <stop offset="1" stop-color="#0e0f14"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafbfd"/>
      <stop offset="1" stop-color="#dfe3ea"/>
    </linearGradient>
    <radialGradient id="stick" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#4a4e5a"/>
      <stop offset="0.55" stop-color="#22242c"/>
      <stop offset="1" stop-color="#090a0d"/>
    </radialGradient>
    <radialGradient id="btn" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde1e8"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="800" height="560" fill="url(#bg)"/>
  <ellipse cx="400" cy="250" rx="380" ry="230" fill="url(#glow)"/>
  <ellipse cx="400" cy="520" rx="300" ry="18" fill="#000" opacity="0.55" filter="url(#soft)"/>

  <!-- shoulder buttons / triggers -->
  <g fill="url(#dark)">
    <path d="M150 128 C160 84 250 78 290 96 L290 130 Z"/>
    <path d="M650 128 C640 84 550 78 510 96 L510 130 Z"/>
  </g>
  <g fill="url(#shell)" stroke="#aab0bc" stroke-width="1.5">
    <path d="M140 140 C160 100 250 92 292 106 L292 132 Z"/>
    <path d="M660 140 C640 100 550 92 508 106 L508 132 Z"/>
  </g>

  <!-- main shell -->
  <path id="body" fill="url(#shell)" stroke="#a9afbb" stroke-width="2" stroke-linejoin="round"
        d="M250 112 C200 102 150 112 125 152 C90 212 50 362 60 442 C66 502 122 520 160 480
           C190 450 215 392 252 372 L548 372 C585 392 610 450 640 480 C678 520 734 502 740 442
           C750 362 710 212 675 152 C650 112 600 102 550 112 C500 120 300 120 250 112 Z"/>

  <!-- dark centre inlay -->
  <path fill="url(#dark)"
        d="M272 118 C282 240 252 296 236 328 C224 358 250 386 292 380 L508 380
           C550 386 576 358 564 328 C548 296 518 240 528 118 C480 121 320 121 272 118 Z"/>

  <!-- light bar -->
  <g stroke="#4f9dff" stroke-width="5" stroke-linecap="round" fill="none">
    <g filter="url(#blur)" opacity="0.9">
      <path d="M292 126 C294 190 300 222 314 240"/>
      <path d="M508 126 C506 190 500 222 486 240"/>
    </g>
    <path stroke="#bfe0ff" stroke-width="2.5" d="M292 126 C294 190 300 222 314 240"/>
    <path stroke="#bfe0ff" stroke-width="2.5" d="M508 126 C506 190 500 222 486 240"/>
  </g>

  <!-- touchpad -->
  <path fill="url(#pad)" stroke="#b4bac6" stroke-width="1.5"
        d="M300 119 C302 190 306 220 322 238 C332 250 468 250 478 238 C494 220 498 190 500 119 C450 121 350 121 300 119 Z"/>

  <!-- create / options -->
  <rect x="254" y="140" width="11" height="26" rx="5.5" fill="#f4f5f8" stroke="#9fa5b1" transform="rotate(-14 259 153)"/>
  <rect x="535" y="140" width="11" height="26" rx="5.5" fill="#f4f5f8" stroke="#9fa5b1" transform="rotate(14 541 153)"/>

  <!-- speaker grille -->
  <g fill="#000" opacity="0.7">
    <circle cx="384" cy="272" r="2.2"/><circle cx="392" cy="272" r="2.2"/><circle cx="400" cy="272" r="2.2"/><circle cx="408" cy="272" r="2.2"/><circle cx="416" cy="272" r="2.2"/>
    <circle cx="388" cy="280" r="2.2"/><circle cx="396" cy="280" r="2.2"/><circle cx="404" cy="280" r="2.2"/><circle cx="412" cy="280" r="2.2"/>
  </g>

  <!-- home + mute -->
  <rect x="380" y="303" width="40" height="22" rx="11" fill="#07080b" stroke="#3a3d47" stroke-width="1.5"/>
  <circle cx="400" cy="314" r="5" fill="none" stroke="#8a8f9c" stroke-width="1.8"/>
  <rect x="386" y="342" width="28" height="9" rx="4.5" fill="#07080b" stroke="#3a3d47"/>
  <rect x="393" y="345" width="14" height="3" rx="1.5" fill="#f59e0b"/>

  <!-- analog sticks -->
  <g id="stickL">
    <circle cx="305" cy="318" r="47" fill="#050608"/>
    <circle cx="305" cy="318" r="41" fill="url(#stick)" stroke="#3b3e48" stroke-width="2"/>
    <circle cx="305" cy="318" r="27" fill="#14151a" stroke="#4a4e59" stroke-width="2.5"/>
    <ellipse cx="297" cy="308" rx="12" ry="7" fill="#fff" opacity="0.07"/>
  </g>
  <use href="#stickL" x="190"/>

  <!-- d-pad -->
  <g fill="url(#btn)" stroke="#a7adb9" stroke-width="1.5" stroke-linejoin="round">
    <path d="M176 172 Q176 166 182 166 L198 166 Q204 166 204 172 L204 194 L190 207 L176 194 Z"/>
    <path d="M176 258 Q176 264 182 264 L198 264 Q204 264 204 258 L204 236 L190 223 L176 236 Z"/>
    <path d="M147 201 Q141 201 141 207 L141 223 Q141 229 147 229 L169 229 L182 215 L169 201 Z"/>
    <path d="M233 201 Q239 201 239 207 L239 223 Q239 229 233 229 L211 229 L198 215 L211 201 Z"/>
  </g>
  <g fill="#8d93a0">
    <path d="M190 172 l6 9 h-12 z"/><path d="M190 258 l6 -9 h-12 z"/>
    <path d="M147 215 l9 -6 v12 z"/><path d="M233 215 l-9 -6 v12 z"/>
  </g>

  <!-- face buttons -->
  <g fill="url(#btn)" stroke="#a7adb9" stroke-width="1.5">
    <circle cx="610" cy="168" r="21"/><circle cx="657" cy="215" r="21"/>
    <circle cx="610" cy="262" r="21"/><circle cx="563" cy="215" r="21"/>
  </g>
  <g fill="none" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M610 157 L620 175 L600 175 Z" stroke="#3fb8a0"/>
    <circle cx="657" cy="215" r="10" stroke="#e8627a"/>
    <path d="M602 254 L618 270 M618 254 L602 270" stroke="#6b8fe6"/>
    <rect x="554" y="206" width="18" height="18" stroke="#c98bd0"/>
  </g>

  <!-- subtle shell highlights -->
  <path d="M112 190 C88 260 70 360 74 430" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M688 190 C712 260 730 360 726 430" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
</svg>
