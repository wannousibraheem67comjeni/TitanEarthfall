name: Pages

# Publishes the playable web build and the privacy policy to GitHub Pages.
# One-time setup: repository Settings > Pages > Build and deployment > Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['hopinet/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: npm install --no-audit --no-fund && node build.mjs
        working-directory: hopinet/web
      - name: Add privacy policy and landing page
        run: |
          cp hopinet/docs/privacy.html hopinet/web/dist/privacy.html
          cp hopinet/docs/privacy-ar.html hopinet/web/dist/privacy-ar.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hopinet/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
