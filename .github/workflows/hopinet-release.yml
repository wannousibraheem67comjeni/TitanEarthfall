name: Release

# Push a tag like v3.1.2.5.5.6 (or run manually) to build signed APK + AAB for both editions,
# the web builds, and attach everything to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: hopinet

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Accept licenses and install SDK 36
        run: yes | sdkmanager --licenses >/dev/null; sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.1

      - name: Web build
        run: npm install --no-audit --no-fund && node build.mjs
        working-directory: hopinet/web

      - name: Restore the upload keystore (optional)
        env:
          HOPINET_KEYSTORE_BASE64: ${{ secrets.HOPINET_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HOPINET_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$HOPINET_KEYSTORE_BASE64" | base64 -d > keystore/hopinet-upload.jks
            echo "HOPINET_KEYSTORE=keystore/hopinet-upload.jks" >> "$GITHUB_ENV"
            echo "Signing enabled"
          else
            echo "::warning::HOPINET_KEYSTORE_BASE64 secret not set: release files will be UNSIGNED (Play Console needs a signed AAB)."
          fi
        working-directory: hopinet/android

      - name: Build APK + AAB (play and free)
        env:
          HOPINET_KEYSTORE_PASSWORD: ${{ secrets.HOPINET_KEYSTORE_PASSWORD }}
          HOPINET_KEY_ALIAS: ${{ secrets.HOPINET_KEY_ALIAS }}
          HOPINET_KEY_PASSWORD: ${{ secrets.HOPINET_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_hopinetPlayLicenseKey: ${{ secrets.HOPINET_PLAY_LICENSE_KEY }}
        run: gradle --no-daemon assemblePlayRelease bundlePlayRelease assembleFreeRelease bundleFreeRelease
        working-directory: hopinet/android

      - name: Collect files
        run: |
          VER=$(grep -o "GAME_VERSION = '[^']*'" web/src/config.js | cut -d"'" -f2)
          mkdir -p out
          cp android/app/build/outputs/apk/play/release/*.apk "out/Hopinet-$VER-play.apk"
          cp android/app/build/outputs/apk/free/release/*.apk "out/Hopinet-$VER-free.apk"
          cp android/app/build/outputs/bundle/playRelease/*.aab "out/Hopinet-$VER-play.aab"
          cp android/app/build/outputs/bundle/freeRelease/*.aab "out/Hopinet-$VER-free.aab"
          (cd web/dist && zip -qr "../../out/Hopinet-$VER-web-pwa.zip" .)
          (cd web/dist-single && zip -q "../../out/Hopinet-$VER-web-single-file.zip" index.html README.txt)
          ls -la out

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: hopinet/out/*
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        with:
          name: hopinet-release-files
          path: hopinet/out/*
