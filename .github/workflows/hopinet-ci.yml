name: CI

on:
  push:
    branches: ['**']
    paths: ['hopinet/**', '.github/workflows/hopinet-*.yml']
  pull_request:
    paths: ['hopinet/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: hopinet

jobs:
  web:
    name: Web build (multi-file, single-file, PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: hopinet/web
      - name: Build
        run: node build.mjs
        working-directory: hopinet/web
      - name: Package web files
        run: |
          mkdir -p ../out
          (cd dist && zip -qr ../../out/Hopinet-web-pwa.zip .)
          (cd dist-single && zip -q ../../out/Hopinet-web-single-file.zip index.html README.txt)
        working-directory: hopinet/web
      - uses: actions/upload-artifact@v4
        with:
          name: hopinet-web
          path: hopinet/out/*.zip

  android:
    name: Android (play + free, debug)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Accept licenses and install SDK 36
        run: yes | sdkmanager --licenses >/dev/null; sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.1
      - name: Build the web game
        run: npm install --no-audit --no-fund && node build.mjs
        working-directory: hopinet/web
      - name: Assemble both editions
        run: gradle --no-daemon assemblePlayDebug assembleFreeDebug
        working-directory: hopinet/android
      - uses: actions/upload-artifact@v4
        with:
          name: hopinet-android-debug
          path: hopinet/android/app/build/outputs/apk/**/*.apk
